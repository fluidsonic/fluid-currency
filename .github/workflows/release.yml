name: Release

# Publishes to Maven Central when a version tag (no `v` prefix, e.g. `0.15.0`) is pushed.
#
# Secrets:
#   SONATYPE_USERNAME / SONATYPE_PASSWORD  Central Portal user token
#   SIGNING_KEY / SIGNING_PASSWORD         ASCII-armored PGP private key and its passphrase
#
# Variables (optional, for publishing a fork under a namespace it owns):
#   PUBLISH_GROUP      Maven group, e.g. `io.github.someone` (default `io.fluidsonic.currency`)
#   PUBLISH_NAMESPACE  Verified Central Portal namespace the group is under (default `io.fluidsonic`)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    name: Release
    # macOS so the Apple targets' tests run before publishing.
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_publishGroup: ${{ vars.PUBLISH_GROUP || 'io.fluidsonic.currency' }}
      ORG_GRADLE_PROJECT_publishNamespace: ${{ vars.PUBLISH_NAMESPACE || 'io.fluidsonic' }}
      ORG_GRADLE_PROJECT_publishRepository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches project version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - run: ./gradlew build

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
